name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The mod API may change between releases: move this pin on purpose.
      - run: npm install --global @anthropic-ai/claude-code@2.1.316
      - run: claude plugin validate plugins/session-dash
      - run: claude plugin test plugins/session-dash
